name: Offline tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install offline test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Compile Python sources
        run: python -m compileall -q src prompts tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run synthetic fusion and coupling smoke test
        run: bash scripts/smoke_test.sh
